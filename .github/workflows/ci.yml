name: CI
on:
  push:
    branches: [main]
  pull_request:
  # REQUIRED by the merge queue: a queue entry is built on its own
  # `gh-readonly-queue/main/...` ref, which emits NEITHER `pull_request` NOR
  # `push`. Without this trigger the required `checks` context never reports on a
  # queued entry and every merge times out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One NATIVE runner per target system.
  #
  # Do NOT collapse this into a single job running `nix flake check --all-systems`.
  # That flag makes the runner try to BUILD every system's checks, and a
  # darwin derivation on an x86_64-linux runner fails with `platform mismatch`
  # before any real check runs. It passes on a dev machine only because a Linux
  # builder is attached there. Each leg here checks its OWN system, natively.
  #
  # All three runner types are free and unlimited on public repositories.
  checks:
    name: checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: kattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake outputs well-formed
        run: nix flake show --all-systems

      # No `--all-systems`: this checks the runner's own system, which is the whole
      # point of the matrix. The Linux legs run `module-eval`; the darwin leg runs
      # `hm-eval`. `treefmt` runs on all three.
      - name: Checks
        run: nix flake check -L

      # NOT run in CI: `nix build .#vm-test`. It builds the real `inngest`, which is
      # unfree (SSPL) and absent from cache.nixos.org, and whose pnpm UI closure is
      # large enough to exhaust a hosted runner's disk. Run it locally when touching
      # the unit's runtime behaviour.

  # Single required context for branch protection / the merge queue.
  required:
    name: required
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every leg succeeded
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = "success" ]
