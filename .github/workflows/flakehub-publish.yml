name: flakehub-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flakehub-publish
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  flakehub-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/flakehub-push@v6
        with:
          name: kattakath/nix-inngest
          visibility: public
          rolling: true
